<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול פניות – קרן עולם התורה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- מסך כניסה -->
  <div id="login" class="login" hidden>
    <div class="login-card">
      <div class="login-logo">💬</div>
      <h1>ניהול פניות</h1>
      <p class="login-sub">קרן עולם התורה</p>
      <div id="login-step1">
        <p class="login-q">מי נכנס/ת?</p>
        <div class="login-users" id="login-users"></div>
      </div>
      <form id="login-step2" hidden>
        <div class="login-who" id="login-who"></div>
        <input type="password" id="login-pass" placeholder="סיסמה" autocomplete="current-password" required>
        <button class="btn primary big" type="submit">כניסה</button>
        <button class="linkish" type="button" id="login-back">→ בחירת משתמש אחר</button>
        <div class="login-err" id="login-err"></div>
      </form>
      <p class="login-empty" id="login-empty" hidden>לא הוגדרו משתמשי צוות (TEAM_USERS).</p>
    </div>
  </div>

  <!-- האפליקציה -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="logo">💬</div>
        <div>
          <div class="brand-title">ניהול פניות</div>
          <div class="brand-sub">קרן עולם התורה</div>
        </div>
      </div>
      <div class="sync" id="sync"></div>
      <div class="me">
        <span class="avatar sm" id="me-avatar"></span>
        <span id="me-name"></span>
        <button class="btn ghost sm" id="logout">יציאה</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <section class="stats" id="stats"></section>

    <main class="layout" id="layout">
      <aside class="list-pane">
        <nav class="tabs" id="tabs"></nav>
        <div class="filters">
          <div class="search-wrap"><span>🔍</span><input type="search" id="search" placeholder="חיפוש שם, מייל או תוכן"></div>
          <div class="chips" id="chips"></div>
        </div>
        <ul class="inq-list" id="list"></ul>
      </aside>
      <section class="detail-pane" id="detail"></section>
    </main>
  </div>

  <dialog id="dlg-escalate" class="dlg">
    <form method="dialog">
      <div class="dlg-icon">↗</div>
      <h3>העברה למנהל</h3>
      <p class="muted">כל ההתכתבות והקבצים יישלחו במייל אל <b id="mgr-addr"></b>, והפניה תרד מהדשבורד.</p>
      <label class="field">הערה למנהל (לא חובה)
        <textarea id="esc-note" rows="3" placeholder="למשל: תורם גדול, מבקש שיחה אישית"></textarea>
      </label>
      <div class="dlg-actions">
        <button value="ok" class="btn violet">העבר למנהל</button>
        <button value="cancel" class="btn ghost">ביטול</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
